# pyproject.toml

[build-system]
requires = ["setuptools>=42.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fermatrica-rep"
version = "0.4.0"
description = "FERMATRICA Flexible Econometrics Regression Models and Tools: Reporting"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache 2.0" }
authors = [
    { name = "OKKAM CS: AMeshkov, Ivan Kocherov, Grigoriy Selyavin, Anton Sevastianov, Anna Gladysheva, Nargiz Bagirova, Kirill Prilipko" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
]

[tool.pytest.ini_options]
addopts = "-n 4"
markers = [
    "integration: integration tests that require --samples-path and a trained model",
]
filterwarnings = [
    "ignore::pandas.errors.Pandas4Warning",
    "ignore::pandas.errors.PerformanceWarning",
]

urls = {"Homepage" = "https://github.com/FERMATRICA/fermatrica_rep"}

[tool.setuptools.packages.find]
where = ["."]
exclude = ["samples*", "build*", "docs*", "tests*"]

[tool.setuptools.package-data]
"*" = ["*.csv", "*.sql", "*.xlsx", "*.pptx", "*.html", "*.xml", "*.txt"]